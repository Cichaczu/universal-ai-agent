name: Universal AI Agent

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write # Wymagane uprawnienie do zapisywania zmian w repozytorium

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj środowisko Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj wymagane biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pandas duckduckgo-search

      - name: Uruchom skrypt agenta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Zapisz zmiany w bazie danych do repozytorium
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add baza_wiedzy.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczny zapis bazy przez AI Agenta" && git push)
